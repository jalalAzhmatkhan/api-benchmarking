name: CI csharp-dotnet

on:
  push:
    branches: [develop, master]
    tags: ["v*"]
    paths: ["services/csharp-dotnet/**", "contract/**", "db/**", "deploy/compose.dev.yaml", ".github/workflows/service-ci.yml", ".github/workflows/ci-csharp-dotnet.yml"]
  pull_request:
    paths: ["services/csharp-dotnet/**", "contract/**", "db/**", "deploy/compose.dev.yaml", ".github/workflows/service-ci.yml", ".github/workflows/ci-csharp-dotnet.yml"]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: csharp-dotnet
      toolchain: dotnet
      toolchain-version: "10.0.x"
      with-postgres: true
      lint-command: |
        dotnet format whitespace Items.slnx --verify-no-changes
        dotnet build Items.slnx -c Release --nologo
      test-command: |
        rc=0
        dotnet test tests/Items.Tests/Items.Tests.csproj -c Release --no-build -p:CollectCoverage=true || rc=$?
        echo "--- lines never executed:"
        python3 - <<'PY'
        import xml.etree.ElementTree as ET
        for cls in ET.parse("tests/Items.Tests/coverage.cobertura.xml").iter("class"):
            miss = sorted({l.get("number") for l in cls.iter("line") if l.get("hits") == "0"}, key=int)
            if miss:
                print(cls.get("filename"), cls.get("name"), miss)
        PY
        exit $rc
