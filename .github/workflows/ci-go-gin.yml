name: CI go-gin

on:
  push:
    branches: [develop, master]
    tags: ["v*"]
    paths: ["services/go-gin/**", "contract/**", "db/**", "deploy/compose.dev.yaml", ".github/workflows/service-ci.yml", ".github/workflows/ci-go-gin.yml"]
  pull_request:
    paths: ["services/go-gin/**", "contract/**", "db/**", "deploy/compose.dev.yaml", ".github/workflows/service-ci.yml", ".github/workflows/ci-go-gin.yml"]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: go-gin
      toolchain: go
      toolchain-version: "1.27.1"
      lint-command: |
        test -z "$(gofmt -l .)"
        go vet ./...
      test-command: |
        go test ./... -covermode=atomic -coverprofile=cover.out
        grep -v '/cmd/server/' cover.out > cover.filtered
        go tool cover -func=cover.filtered | tail -n 1
        test "$(go tool cover -func=cover.filtered | awk '/^total:/{print $3}')" = "100.0%"
