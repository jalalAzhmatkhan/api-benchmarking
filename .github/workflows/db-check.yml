name: DB check

on:
  push:
    branches: [develop, master]
    paths: ["db/**", ".github/workflows/db-check.yml"]
  pull_request:
    paths: ["db/**", ".github/workflows/db-check.yml"]

permissions:
  contents: read

jobs:
  schema-seed-reset:
    name: Schema, seed and reset on PostgreSQL 18.6
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Pinned by digest (VERSIONS.md)
        image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
        env:
          POSTGRES_USER: bench
          POSTGRES_PASSWORD: bench
          POSTGRES_DB: bench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bench -d bench" --health-interval 5s
          --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGUSER: bench
      PGPASSWORD: bench
      PGDATABASE: bench
    steps:
      - uses: actions/checkout@v7
      - name: Ensure psql client
        run: command -v psql >/dev/null || (sudo apt-get update -q && sudo apt-get install -y -q postgresql-client)

      - name: init.sh applies the migration and seeds 100 000 rows
        run: |
          db/init.sh
          test "$(psql -tAc 'SELECT count(*) FROM items')" = "100000"

      - name: init.sh is idempotent
        run: |
          db/init.sh
          test "$(psql -tAc 'SELECT count(*) FROM items')" = "100000"

      - name: Seed is deterministic
        run: |
          psql -tAc "SELECT name, coalesce(description,'<null>'), price_cents, quantity FROM items WHERE id IN (1, 10, 99999) ORDER BY id" | tee seed-sample.txt
          grep -q '^item-10|<null>|370|10$' seed-sample.txt
          grep -q '^item-1|desc-c4ca4238a0b923820dcc509a6f75849b|37|1$' seed-sample.txt

      - name: Constraints reject invalid rows
        run: |
          for bad in "('', 'x', 1, 1)" "('ok', 'x', -1, 1)" "('ok', 'x', 1, -1)" "(repeat('a',101), 'x', 1, 1)"; do
            if psql -c "INSERT INTO items (name, description, price_cents, quantity) VALUES $bad" 2>/dev/null; then
              echo "accepted invalid row: $bad"; exit 1
            fi
          done

      - name: reset.sh restores the pristine state in under 10 s
        run: |
          psql -c "INSERT INTO items (name, price_cents, quantity) SELECT 'tmp', 1, 1 FROM generate_series(1, 5000)"
          start=$(date +%s)
          db/reset.sh
          elapsed=$(( $(date +%s) - start ))
          echo "elapsed: ${elapsed}s"
          test "$elapsed" -lt 10
          test "$(psql -tAc 'SELECT count(*) FROM items')" = "100000"

      - name: First id after reset is 100001
        run: |
          id=$(psql -qtAc "INSERT INTO items (name, price_cents, quantity) VALUES ('first', 1, 1) RETURNING id")
          test "$id" = "100001"
