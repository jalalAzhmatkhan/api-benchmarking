name: CI node-fastify

on:
  push:
    branches: [develop, master]
    tags: ["v*"]
    paths: ["services/node-fastify/**", "contract/**", "db/**", "deploy/compose.dev.yaml", ".github/workflows/service-ci.yml", ".github/workflows/ci-node-fastify.yml"]
  pull_request:
    paths: ["services/node-fastify/**", "contract/**", "db/**", "deploy/compose.dev.yaml", ".github/workflows/service-ci.yml", ".github/workflows/ci-node-fastify.yml"]

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/service-ci.yml
    with:
      service: node-fastify
      toolchain: node
      toolchain-version: "26"
      with-postgres: true
      setup-command: npm ci
      lint-command: npm run typecheck
      test-command: npm test
