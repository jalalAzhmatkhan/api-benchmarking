# Runtime configuration contract (contract/README.md): PORT, DATABASE_URL, DB_POOL_SIZE.
server.port=${PORT:8080}

# Benchmark rules (Documentation/specs/benchmark-rules.md): no per-request/access logging,
# application log level WARN. Everything else stays at the Boot defaults (virtual threads off,
# Tomcat defaults, no compression, no caching headers).
logging.level.root=WARN
spring.main.banner-mode=off
