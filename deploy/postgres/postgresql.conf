# PostgreSQL configuration for the benchmark (identical for every stack).
# Spec: Documentation/plans/deployment-plan.md §7. Durability stays ON for a fair write benchmark.
listen_addresses = '127.0.0.1'
port = 5432
max_connections = 50
superuser_reserved_connections = 3

shared_buffers = 512MB
effective_cache_size = 2GB
work_mem = 4MB
maintenance_work_mem = 128MB
wal_buffers = 16MB
max_wal_size = 2GB
min_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200

fsync = on
synchronous_commit = on
full_page_writes = on
autovacuum = on
password_encryption = scram-sha-256

# No statement logging or I/O timing during measurements.
log_min_duration_statement = -1
track_io_timing = off
