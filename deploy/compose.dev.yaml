# Local development stack: PostgreSQL 18.6 + schema/seed init, and (optionally) the contract mock.
# NOT the benchmark topology (see deploy/compose.yaml in T-5.3: host networking, no CPU limits).
#
#   docker compose -f deploy/compose.dev.yaml up -d postgres db-init      # database only
#   docker compose -f deploy/compose.dev.yaml --profile mock up -d        # + mock API on :8080
#   k6 run -e BASE_URL=http://127.0.0.1:8080 contract/conformance.js
#   docker compose -f deploy/compose.dev.yaml down -v                     # wipe everything
name: api-benchmarking-dev

services:
  postgres:
    # Pinned by digest (VERSIONS.md)
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    container_name: bench-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bench          # bootstrap role = superuser (reset.sh needs CHECKPOINT/pg_stat_reset)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bench}
      POSTGRES_DB: bench
    command: ["postgres", "-c", "max_connections=50"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-init:
    image: postgres:18.6-trixie@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    environment:
      PGHOST: postgres
      PGUSER: bench
      PGPASSWORD: ${POSTGRES_PASSWORD:-bench}
      PGDATABASE: bench
    volumes:
      - ../db:/db:ro
    entrypoint: ["bash", "/db/init.sh"]

  # Reference implementation of the contract, used to try the conformance suite locally.
  mock:
    profiles: ["mock"]
    image: python:3.14.8-slim-trixie@sha256:89fb7d3da20043c370643435258bdd7ab755d326d359001d02988ed15ae5219e
    container_name: bench-mock
    environment:
      PORT: "8080"
      MOCK_BUG: ${MOCK_BUG:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../contract/mock/server.py:/app/server.py:ro
    command: ["python", "/app/server.py"]

volumes:
  pgdata:
